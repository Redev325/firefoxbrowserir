# The repository is a Firefox/Android source tree, not a Jekyll project.
# Keep GitHub Pages focused on the small static browser homepage at the repository root.
exclude:
  - ".github"
  - ".gitmodules"
  - ".adjust_token"
  - ".buildconfig.yml"
  - ".gitattributes"
  - ".gitignore"
  - "android-components"
  - "app"
  - "automation"
  - "benchmark"
  - "certificates"
  - "config"
  - "docs"
  - "fork-asset-sources"
  - "gradle"
  - "mozilla-detekt-rules"
  - "plugins"
  - "tools"
  - "CODE_OF_CONDUCT.md"
  - "Jenkinsfile"
  - "README.md"
  - "SECURITY.md"
  - "autopublish-settings.gradle"
  - "bors.toml"
  - "build.gradle"
  - "buildid.h"
  - "check_i18n_strings.py"
  - "codecov.yml"
  - "gradle.properties"
  - "gradlew"
  - "gradlew.bat"
  - "l10n.toml"
  - "mozconfig.json"
  - "settings.gradle"
  - "shared-lint.xml"
  - "shared-settings.gradle"
  - "version.txt"
